spring.application.name=btvn

# ===============================
# PostgreSQL Datasource Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/vidu
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 1. Log của toàn bộ ứng dụng ở mức INFO
logging.level.root=INFO

# 2. Log của Hibernate/JPA ở mức DEBUG (hiển thị câu lệnh SQL gửi xuống DB)
logging.level.org.hibernate.SQL=DEBUG

# 3. Log của package com.medical.service ở mức TRACE
logging.level.java.spring.btvn.service=TRACE